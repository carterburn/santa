[package]
name = "santa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
auxv = "0.3.3"
clap = { version = "4.5.45", features = ["derive"] }
env_logger = "0.11.8"
log = { version = "0.4.27", features = ["release_max_level_off"]}
nix = { version = "0.30.1", features = ["feature", "mman", "user", "fs"] }
ureq = { version = "3.1.0", optional = true}
zerocopy = { version = "0.8.26", features = ["derive", "std"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[features]
default = []
web_request = ["ureq"]
